<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Truy cập bị chặn - HRMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.15);
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon {
      width: 80px; height: 80px;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      color: #f87171;
      margin-bottom: 12px;
    }
    .msg {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .url-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #f87171;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .rule-info {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #2563eb; }
    .warning {
      margin-top: 24px;
      font-size: 11px;
      color: #ef4444;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛑</div>
    <h1>Truy cập bị chặn!</h1>
    <p class="msg">
      Trang web bạn đang cố gắng truy cập đã bị quản trị viên hệ thống HRMS chặn theo chính sách bảo mật nội bộ của công ty.
    </p>
    <div class="url-box" id="blocked-url">Loading...</div>
    <p class="rule-info" id="rule-info"></p>
    <a href="https://www.google.com" class="btn">← Quay lại Google</a>
    <p class="warning">⚠️ Hành vi truy cập này đã được ghi nhận vào nhật ký hệ thống.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const blockedUrl = params.get('url') || 'Unknown URL';
    const rulePattern = params.get('rule') || '';
    
    document.getElementById('blocked-url').textContent = blockedUrl;
    if (rulePattern) {
      document.getElementById('rule-info').textContent = `Quy tắc áp dụng: ${rulePattern}`;
    }
  </script>
</body>
</html>
