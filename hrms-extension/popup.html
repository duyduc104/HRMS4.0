<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }

    .header h1 {
      font-size: 16px;
      color: #60a5fa;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 11px;
      color: #94a3b8;
    }

    .status {
      margin: 16px 0;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    }

    .status.online {
      background: #064e3b;
      border: 1px solid #059669;
    }

    .status.offline {
      background: #451a03;
      border: 1px solid #d97706;
    }

    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .status.online .dot {
      background: #34d399;
      animation: pulse 2s infinite;
    }

    .status.offline .dot {
      background: #fbbf24;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #60a5fa;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      margin-top: 8px;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .info {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }

    .warning-msg {
      font-size: 12px;
      color: #fbbf24;
      text-align: center;
      margin-top: 8px;
      padding: 8px;
      background: rgba(251, 191, 36, 0.1);
      border-radius: 6px;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .warning-msg:empty {
      display: none;
    }

    #login-form,
    #logged-in {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ HRMS Web Filter</h1>
      <p>Bộ lọc & giám sát truy cập web</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="status offline">
        <span class="dot"></span> Chưa đăng nhập
      </div>
      <div class="form-group">
        <label>Tên đăng nhập (Username)</label>
        <input type="text" id="username" placeholder="VD: admin" />
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" id="btn-login">Đăng nhập</button>
      <p id="error-msg" style="color: #f87171; font-size: 12px; margin-top: 8px; text-align: center;"></p>
    </div>

    <!-- LOGGED IN VIEW -->
    <div id="logged-in">
      <div class="status online">
        <span class="dot"></span> Đang giám sát
      </div>
      <p class="info" id="info-text">Đang tải...</p>
      <button class="btn btn-danger" id="btn-logout">Đăng xuất</button>
      <p class="warning-msg" id="logout-msg"></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
